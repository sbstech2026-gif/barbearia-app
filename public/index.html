<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 12px;
            border: 2px solid #d4af37;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #888888;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
        }

        .barber-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .barber-card {
            background-color: #2a2a2a;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
        }

        .barber-card:hover, .barber-card.selected {
            border-color: #d4af37;
            background-color: #322d1b;
        }

        .barber-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .barber-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #d4af37;
            color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .barber-name {
            font-size: 14px;
            font-weight: 600;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: none;
            border-radius: 8px;
            color: #121212;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=200" alt="Logo Barbearia" class="logo">
            <h1 class="title">Agende seu Horário</h1>
            <p class="subtitle">Escolha o serviço, barbeiro e horário de sua preferência</p>
        </div>

        <form id="formAgendamento">
            <div class="form-group">
                <label for="cliente">Seu Nome Completo</label>
                <input type="text" id="cliente" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="whatsapp">Seu WhatsApp</label>
                <input type="tel" id="whatsapp" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="servico">Selecione o Serviço</label>
                <select id="servico" required>
                    <option value="" disabled selected>Escolha um serviço...</option>
                    <option value="Corte de Cabelo" data-preco="35">Corte de Cabelo (R$ 35,00)</option>
                    <option value="Barba Completa" data-preco="30">Barba Completa (R$ 30,00)</option>
                    <option value="Combo (Corte + Barba)" data-preco="60">Combo (Corte + Barba) (R$ 60,00)</option>
                    <option value="Sobrancelha" data-preco="15">Sobrancelha (R$ 15,00)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Escolha o Barbeiro</label>
                <div class="barber-grid">
                    <div class="barber-card selected" onclick="selectBarber('Carlos (Mestre Barbeiro)', this)">
                        <div class="barber-info">
                            <div class="barber-avatar">C</div>
                            <span class="barber-name">Carlos (Mestre Barbeiro)</span>
                        </div>
                    </div>
                    <div class="barber-card" onclick="selectBarber('Mateus Silva', this)">
                        <div class="barber-info">
                            <div class="barber-avatar">M</div>
                            <span class="barber-name">Mateus Silva</span>
                        </div>
                    </div>
                    <div class="barber-card" onclick="selectBarber('Sandro', this)">
                        <div class="barber-info">
                            <div class="barber-avatar">S</div>
                            <span class="barber-name">Sandro</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>
                <div style="flex: 1;">
                    <label for="horario">Horário</label>
                    <input type="time" id="horario" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Confirmar pelo WhatsApp</button>
        </form>
    </div>

    <script>
        let barbeiroSelecionado = 'Carlos (Mestre Barbeiro)';

        function selectBarber(nome, el) {
            barbeiroSelecionado = nome;
            document.querySelectorAll('.barber-card').forEach(card => card.classList.remove('selected'));
            el.classList.add('selected');
        }

        document.getElementById('formAgendamento').addEventListener('submit', async function(e) {
            e.preventDefault();

            const cliente = document.getElementById('cliente').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const selectServico = document.getElementById('servico');
            const servico = selectServico.value;
            const preco = selectServico.options[selectServico.selectedIndex].getAttribute('data-preco') || 0;
            const data = document.getElementById('data').value;
            const horario = document.getElementById('horario').value;

            // Formata data de YYYY-MM-DD para DD/MM/YYYY
            const dataFormatada = data.split('-').reverse().join('/');

            // 1. Salva no banco de dados via API do Backend
            try {
                await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente,
                        whatsapp,
                        servico: `${servico} (R$ ${preco}.00)`,
                        barbeiro: barbeiroSelecionado,
                        data: dataFormatada,
                        horario,
                        preco: parseFloat(preco)
                    })
                });
            } catch (err) {
                console.error("Erro ao salvar agendamento:", err);
            }

            // 2. Abre o WhatsApp com a mensagem formatada
            const numeroBarbearia = '5549988727098'; // Seu número
            const mensagem = `Olá! Gostaria de agendar um horário:%0A%0A` +
                             `👤 *Cliente:* ${cliente}%0A` +
                             `📱 *WhatsApp:* ${whatsapp}%0A` +
                             `✂️ *Serviço:* ${servico} (R$ ${preco}.00)%0A` +
                             `💈 *Barbeiro:* ${barbeiroSelecionado}%0A` +
                             `📅 *Data:* ${dataFormatada}%0A` +
                             `⏰ *Horário:* ${horario}`;

            window.open(`https://wa.me/${numeroBarbearia}?text=${mensagem}`, '_blank');
        });
    </script>
</body>
</html>
