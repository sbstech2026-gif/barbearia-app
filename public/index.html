<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Agendamento Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            background-color: #141414;
            border-radius: 16px;
            border: 1px solid #222222;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* Banner Topo */
        .banner {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid #2a2a2a;
        }

        .content {
            padding: 24px 20px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            color: #d4af37;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-title p {
            color: #888888;
            font-size: 12px;
            margin-top: 2px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .label-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        select, input[type="text"], input[type="tel"], input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            background-color: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            color-scheme: dark;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        /* Legenda de Horários */
        .legend-box {
            background-color: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .dot-free { background-color: #2a2a2a; border: 1px solid #444; }
        .dot-selected { background-color: #d4af37; }
        .dot-busy { background-color: #8b0000; }

        /* Area de seleção de horário */
        .slots-container {
            background-color: #181818;
            border: 1px dashed #2e2e2e;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            color: #777777;
            font-size: 13px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-slot {
            background-color: #222222;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-slot.selected {
            background-color: #d4af37;
            color: #121212;
            font-weight: bold;
            border-color: #d4af37;
        }

        .btn-slot.busy {
            background-color: #3a1515;
            color: #884444;
            cursor: not-allowed;
            border-color: #552222;
        }

        hr {
            border: none;
            border-top: 1px solid #222222;
            margin: 20px 0;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            background-color: #222222;
            color: #666666;
            border: 1px solid #333333;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-confirm.active {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #121212;
            border: none;
            cursor: pointer;
        }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: #555555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Banner Superior -->
        <img src="banner-barbearia.jpeg" alt="BarberFlow SaaS" class="banner" onerror="this.style.display='none'">

        <div class="content">
            <!-- Título Barbearia -->
            <div class="header-title">
                <h1>✂ BARBEARIA ESTILO</h1>
                <p>Seu estilo. Seu momento.</p>
            </div>

            <form id="formAgendamento">
                <!-- 1. ESCOLHA O SERVIÇO -->
                <div class="form-group">
                    <div class="label-icon">✨ 1. ESCOLHA O SERVIÇO</div>
                    <select id="servico" required>
                        <option value="" disabled selected>Selecione um serviço...</option>
                        <option value="Corte de Cabelo" data-preco="35">Corte de Cabelo - R$ 35,00</option>
                        <option value="Barba Completa" data-preco="30">Barba Completa - R$ 30,00</option>
                        <option value="Combo (Corte + Barba)" data-preco="60">Combo (Corte + Barba) - R$ 60,00</option>
                        <option value="Sobrancelha" data-preco="15">Sobrancelha - R$ 15,00</option>
                    </select>
                </div>

                <!-- 2. ESCOLHA O BARBEIRO -->
                <div class="form-group">
                    <div class="label-icon">👤 2. ESCOLHA O BARBEIRO</div>
                    <select id="barbeiro" required>
                        <option value="" disabled selected>Selecione um barbeiro...</option>
                        <option value="Carlos (Mestre Barbeiro)">Carlos (Mestre Barbeiro)</option>
                        <option value="Mateus Silva">Mateus Silva</option>
                        <option value="Sandro">Sandro</option>
                    </select>
                </div>

                <!-- 3. SELECIONE A DATA -->
                <div class="form-group">
                    <div class="label-icon">📅 3. SELECIONE A DATA</div>
                    <input type="date" id="data" required>
                </div>

                <!-- 4. SELECIONE O HORÁRIO -->
                <div class="form-group">
                    <div class="label-icon">🕒 4. SELECIONE O HORÁRIO</div>
                    
                    <div class="legend-box">
                        <div class="legend-item"><div class="dot dot-free"></div><span style="color:#888;">Livre</span></div>
                        <div class="legend-item"><div class="dot dot-selected"></div><span style="color:#d4af37;">Selecionado</span></div>
                        <div class="legend-item"><div class="dot dot-busy"></div><span style="color:#b84444;">Ocupado</span></div>
                    </div>

                    <div class="slots-container" id="containerHorarios">
                        Selecione o barbeiro primeiro.
                    </div>
                </div>

                <hr>

                <!-- SEU NOME -->
                <div class="form-group">
                    <div class="label-icon">👤 SEU NOME</div>
                    <input type="text" id="nome" placeholder="Ex: João Silva" required>
                </div>

                <!-- SEU WHATSAPP -->
                <div class="form-group">
                    <div class="label-icon">📞 SEU WHATSAPP</div>
                    <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" minlength="10" maxlength="15" required>
                </div>

                <!-- BOTÃO CONFIRMAR -->
                <button type="submit" class="btn-confirm" id="btnConfirmar" disabled>CONFIRMAR AGENDAMENTO</button>
            </form>

            <div class="footer-text">
                &lt;/&gt; Desenvolvido com Node.js e React/Web Techs
            </div>
        </div>
    </div>

    <script>
        // Define a data atual como padrão
        const hojeIso = new Date().toISOString().split('T')[0];
        document.getElementById('data').value = hojeIso;

        let horarioSelecionado = null;

        const selectBarbeiro = document.getElementById('barbeiro');
        const containerHorarios = document.getElementById('containerHorarios');
        const btnConfirmar = document.getElementById('btnConfirmar');

        // Gera horários quando escolhe o barbeiro
        selectBarbeiro.addEventListener('change', gerarHorarios);

        function gerarHorarios() {
            containerHorarios.innerHTML = '';
            const horariosValidos = ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'];

            horariosValidos.forEach(hora => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn-slot';
                btn.innerText = hora;
                
                btn.onclick = () => {
                    document.querySelectorAll('.btn-slot').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    horarioSelecionado = hora;
                    validarFormulario();
                };

                containerHorarios.appendChild(btn);
            });
        }

        function validarFormulario() {
            const nomeValido = document.getElementById('nome').value.trim() !== '';
            const whatsValido = document.getElementById('whatsapp').value.trim().length >= 10;
            const servicoValido = document.getElementById('servico').value !== '';
            const barbeiroValido = selectBarbeiro.value !== '';
            
            if (horarioSelecionado && nomeValido && whatsValido && servicoValido && barbeiroValido) {
                btnConfirmar.classList.add('active');
                btnConfirmar.disabled = false;
            } else {
                btnConfirmar.classList.remove('active');
                btnConfirmar.disabled = true;
            }
        }

        document.getElementById('nome').addEventListener('input', validarFormulario);
        document.getElementById('whatsapp').addEventListener('input', validarFormulario);
        document.getElementById('servico').addEventListener('change', validarFormulario);

        // Envio corrigido do formulário para salvar no Banco de Dados
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!horarioSelecionado) {
                alert('Por favor, selecione um horário antes de confirmar.');
                return;
            }

            btnConfirmar.disabled = true;
            btnConfirmar.innerText = 'SALVANDO AGENDAMENTO...';

            const cliente = document.getElementById('nome').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const selectServico = document.getElementById('servico');
            const servico = selectServico.value;
            const preco = parseFloat(selectServico.options[selectServico.selectedIndex].getAttribute('data-preco')) || 0;
            const barbeiro = selectBarbeiro.value;
            const data = document.getElementById('data').value;
            const dataFormatada = data.split('-').reverse().join('/');

            const dadosAgendamento = {
                cliente,
                whatsapp,
                servico,
                barbeiro,
                data,
                horario: horarioSelecionado,
                preco,
                status: 'Pendente'
            };

            try {
                const res = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosAgendamento)
                });

                if (!res.ok) {
                    throw new Error('Falha ao salvar no servidor.');
                }

                // Mensagem do WhatsApp pronta
                const mensagem = `Olá! Gostaria de agendar um horário:%0A%0A` +
                                 `👤 *Cliente:* ${cliente}%0A` +
                                 `📱 *WhatsApp:* ${whatsapp}%0A` +
                                 `✂️ *Serviço:* ${servico} (R$ ${preco}.00)%0A` +
                                 `💈 *Barbeiro:* ${barbeiro}%0A` +
                                 `📅 *Data:* ${dataFormatada}%0A` +
                                 `⏰ *Horário:* ${horarioSelecionado}`;

                window.open(`https://wa.me/5549988727098?text=${mensagem}`, '_blank');
                window.location.reload();

            } catch (err) {
                console.error('Erro ao salvar no banco:', err);
                alert('Ocorreu um erro ao registrar o agendamento. Tente novamente.');
                btnConfirmar.disabled = false;
                btnConfirmar.innerText = 'CONFIRMAR AGENDAMENTO';
            }
        });
    </script>
</body>
</html>
