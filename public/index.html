// Função para carregar profissionais do banco no <select> de agendamento
async function carregarProfissionaisSelect() {
  const selectProfissional = document.getElementById('barbeiro') || document.getElementById('profissional');
  if (!selectProfissional) return;

  try {
    const res = await fetch('/api/profissionais');
    const dados = await res.json();

    if (dados && dados.length > 0) {
      selectProfissional.innerHTML = '<option value="">Selecione o profissional...</option>';
      dados.forEach(p => {
        const option = document.createElement('option');
        option.value = p.nome;
        option.textContent = p.nome;
        selectProfissional.appendChild(option);
      });
    }
  } catch (err) {
    console.error('Erro ao carregar lista de profissionais:', err);
  }
}

// Chamar ao carregar a página
document.addEventListener('DOMContentLoaded', () => {
  carregarProfissionaisSelect();
});
