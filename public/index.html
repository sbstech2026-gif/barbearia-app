<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Agendamento Digital</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --accent-color: #d4af37;
            --accent-hover: #c5a028;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2d3139;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Topo / Logo */
        .brand-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            margin: 0 auto 12px auto;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            display: block;
        }

        .brand-header h1 {
            font-size: 20px;
            color: var(--accent-color);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Formulário Card */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            color-scheme: dark;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        /* Grade de Horários */
        .legend-grid {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-livre { background-color: var(--border-color); }
        .dot-selecionado { background-color: var(--accent-color); }
        .dot-ocupado { background-color: var(--danger); }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .slot-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .slot-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
        }

        .slot-btn.selected {
            background-color: var(--accent-color);
            color: #121212;
            border-color: var(--accent-color);
        }

        .slot-btn.occupied {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Botão de Envio */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        /* Tela de Sucesso */
        .success-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .success-screen h2 {
            color: var(--success);
            margin-bottom: 10px;
            font-size: 22px;
        }

        .success-screen p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #22bf5b;
        }

        .btn-new {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-new:hover {
            border-color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Topo da Barbearia -->
        <div class="brand-header">
            <!-- Caso sua imagem tenha outro nome (ex: logo.jpg), basta alterar o src abaixo -->
            <img src="BarberFLOW.jpeg" alt="Logo BarberFlow" class="logo-img" onerror="this.style.display='none'">
            <h1>BARBEARIA ESTILO</h1>
            <p>Seu estilo. Seu momento.</p>
        </div>

        <div class="card">
            <!-- Formulário de Agendamento -->
            <form id="formAgendamento">
                <div class="form-group">
                    <label for="servico">1. Escolha o Serviço</label>
                    <select id="servico" class="form-control" required>
                        <option value="Corte Social / Degradê" data-preco="45">Corte Social / Degradê - R$ 45,00</option>
                        <option value="Barba Completa" data-preco="35">Barba Completa - R$ 35,00</option>
                        <option value="Corte + Barba" data-preco="75">Corte + Barba - R$ 75,00</option>
                        <option value="Pezinho / Acabamento" data-preco="20">Pezinho / Acabamento - R$ 20,00</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="barbeiro">2. Escolha o Barbeiro</label>
                    <select id="barbeiro" class="form-control" required>
                        <option value="Carlos (Mestre Barbeiro)">Carlos (Mestre Barbeiro)</option>
                        <option value="João (Estilista)">João (Estilista)</option>
                        <option value="Marcos (Fade Specialist)">Marcos (Fade Specialist)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="data">3. Selecione a Data</label>
                    <input type="date" id="data" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>4. Selecione o Horário</label>
                    <div class="legend-grid">
                        <div class="legend-item"><div class="legend-dot dot-livre"></div> Livre</div>
                        <div class="legend-item"><div class="legend-dot dot-selecionado"></div> Selecionado</div>
                        <div class="legend-item"><div class="legend-dot dot-ocupado"></div> Ocupado</div>
                    </div>
                    <div class="slots-grid" id="slotsGrid">
                        <!-- Horários inseridos via JS -->
                    </div>
                    <input type="hidden" id="horarioSelecionado" required>
                </div>

                <div class="form-group">
                    <label for="clienteNome">Seu Nome</label>
                    <input type="text" id="clienteNome" class="form-control" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="clienteWhatsapp">Seu WhatsApp</label>
                    <input type="tel" id="clienteWhatsapp" class="form-control" placeholder="(00) 00000-0000" required>
                </div>

                <button type="submit" class="btn-submit">Confirmar Agendamento</button>
            </form>

            <!-- Tela de Sucesso -->
            <div id="successScreen" class="success-screen">
                <div class="success-icon">🎉</div>
                <h2>Agendamento Confirmado!</h2>
                <p id="successMessage">Seu horário foi reservado com sucesso. Te esperamos na barbearia!</p>
                
                <a id="btnWhatsappLink" href="#" target="_blank" class="btn-whatsapp">
                    📱 Enviar Confirmação no WhatsApp
                </a>
                
                <button type="button" class="btn-new" onclick="resetarFormulario()">Fazer Novo Agendamento</button>
            </div>
        </div>
    </div>

    <script>
        const inputData = document.getElementById('data');
        const slotsGrid = document.getElementById('slotsGrid');
        const inputHorario = document.getElementById('horarioSelecionado');
        
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        const dataHojeStr = `${ano}-${mes}-${dia}`;
        
        inputData.value = dataHojeStr;
        inputData.min = dataHojeStr;

        const horariosPadrao = [
            '08:00', '09:00', '10:00', '11:00',
            '12:00', '13:00', '14:00', '15:00',
            '16:00', '17:00', '18:00', '19:00', '20:00'
        ];

        async function carregarHorariosOcupados() {
            const dataSelecionada = inputData.value;
            const barbeiroSelecionado = document.getElementById('barbeiro').value;

            try {
                const res = await fetch(`/api/agendamentos/ocupados?data=${dataSelecionada}&barbeiro=${encodeURIComponent(barbeiroSelecionado)}`);
                const data = await res.json();
                const horariosOcupados = data.ocupados || [];
                renderizarSlots(horariosOcupados, dataSelecionada);
            } catch (e) {
                console.error('Erro ao buscar horários ocupados:', e);
                renderizarSlots([], dataSelecionada);
            }
        }

        function renderizarSlots(ocupados, dataSelecionada) {
            slotsGrid.innerHTML = '';
            inputHorario.value = '';

            const horaAtualRelogio = new Date().getHours();
            const minutosAtuaisRelogio = new Date().getMinutes();
            const ehHoje = (dataSelecionada === dataHojeStr);

            horariosPadrao.forEach(hora => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'slot-btn';
                btn.innerText = hora;

                const [hStr, mStr] = hora.split(':');
                const horaInt = parseInt(hStr);
                const minInt = parseInt(mStr);

                let jaPassou = false;
                if (ehHoje) {
                    if (horaInt < horaAtualRelogio || (horaInt === horaAtualRelogio && minInt <= minutosAtuaisRelogio)) {
                        jaPassou = true;
                    }
                }

                if (ocupados.includes(hora) || jaPassou) {
                    btn.classList.add('occupied');
                    btn.disabled = true;
                } else {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.slot-btn').forEach(b => {
                            if (!b.classList.contains('occupied')) b.classList.remove('selected');
                        });
                        btn.classList.add('selected');
                        inputHorario.value = hora;
                    });
                }

                slotsGrid.appendChild(btn);
            });
        }

        inputData.addEventListener('change', (e) => {
            if (e.target.value < dataHojeStr) {
                alert('Não é permitido selecionar datas passadas.');
                inputData.value = dataHojeStr;
            }
            carregarHorariosOcupados();
        });

        document.getElementById('barbeiro').addEventListener('change', carregarHorariosOcupados);

        // Envio do formulário ajustado para corresponder ao backend
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            const horario = inputHorario.value;
            if (!horario) {
                alert('Por favor, selecione um horário disponível.');
                return;
            }

            const servicoSelect = document.getElementById('servico');
            const servicoNome = servicoSelect.value;
            const preco = parseFloat(servicoSelect.options[servicoSelect.selectedIndex].dataset.preco);
            const barbeiroNome = document.getElementById('barbeiro').value;
            const data = inputData.value;
            const clienteNome = document.getElementById('clienteNome').value;
            const clienteWhatsapp = document.getElementById('clienteWhatsapp').value;

            const payload = {
                servico: servicoNome,
                preco: preco,
                barbeiro: barbeiroNome,
                data: data,
                horario: horario,
                cliente: clienteNome,
                telefone: clienteWhatsapp
            };

            try {
                const res = await fetch('/api/agendamentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resultado = await res.json();
                if (res.ok && (resultado.sucesso !== false)) {
                    document.getElementById('formAgendamento').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';

                    const dataFormatada = data.split('-').reverse().join('/');
                    document.getElementById('successMessage').innerText = 
                        `Olá ${clienteNome}, seu agendamento de ${servicoNome} com ${barbeiroNome} para o dia ${dataFormatada} às ${horario} foi confirmado!`;

                    const msgWhats = `Olá, acabei de agendar ${servicoNome} para o dia ${dataFormatada} às ${horario} pelo sistema!`;
                    const numeroBarbeiro = '5549999999999'; 
                    document.getElementById('btnWhatsappLink').href = `https://wa.me/${numeroBarbeiro}?text=${encodeURIComponent(msgWhats)}`;

                } else {
                    alert('Erro ao agendar: ' + (resultado.erro || 'Horário já ocupado.'));
                    carregarHorariosOcupados();
                }
            } catch (err) {
                console.error('Erro de conexão:', err);
                alert('Erro de conexão ao tentar realizar o agendamento.');
            }
        });

        function resetarFormulario() {
            document.getElementById('formAgendamento').reset();
            inputData.value = dataHojeStr;
            document.getElementById('successScreen').style.display = 'none';
            document.getElementById('formAgendamento').style.display = 'block';
            carregarHorariosOcupados();
        }

        carregarHorariosOcupados();
    </script>
</body>
</html>
