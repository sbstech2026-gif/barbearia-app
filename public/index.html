<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBarber - Agendamento Online</title>

  <!-- PWA & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartBarber">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA820A',
            darkBg: '#121212',
            cardBg: '#1E1E24'
          }
        }
      }
    }
  </script>
  <style>
    .slot-btn {
      transition: all 0.2s ease;
    }
    .slot-btn.selected {
      background-color: #D4AF37 !important;
      color: #121212 !important;
      font-weight: bold;
      border-color: #D4AF37 !important;
    }
    .slot-btn.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans flex justify-center items-center p-3 sm:p-6">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-emerald-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm transition-all duration-300">
    Mensagem aqui!
  </div>

  <main class="w-full max-w-md bg-cardBg rounded-2xl border border-gold/20 p-5 sm:p-6 shadow-2xl relative">
    
    <!-- Header Barbearia -->
    <header class="flex items-center justify-between pb-4 mb-5 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <img src="logo-barbearia.jpeg" alt="SmartBarber" class="w-12 h-12 rounded-xl object-cover border border-gold/40 shadow-md" onerror="this.onerror=null; this.src='banner-barbearia.jpeg';">
        <div>
          <span class="text-[10px] uppercase tracking-widest text-gold font-bold block">SmartBarber</span>
          <h1 class="text-xl font-bold text-white leading-tight">Barbearia Style</h1>
          <p class="text-xs text-gray-400">Seu estilo. Seu momento.</p>
        </div>
      </div>
      <a href="painel.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-gold border border-gold/30 px-3 py-1.5 rounded-lg transition font-semibold">
        👤 Painel
      </a>
    </header>

    <!-- Banner Promocional -->
    <div class="mb-5 rounded-xl overflow-hidden border border-gold/30 shadow-lg">
      <img src="banner-barbearia.jpeg" alt="Banner Barbearia" class="w-full h-32 object-cover" onerror="this.style.display='none';">
    </div>

    <!-- Form de Agendamento -->
    <form id="formAgendamento" onsubmit="confirmarAgendamento(event)" class="space-y-4">

      <!-- 1. SELEÇÃO DE SERVIÇO -->
      <div>
        <label for="selectServico" class="block text-xs font-bold text-gold uppercase tracking-wider mb-1.5">
          💈 1. Escolha o Serviço
        </label>
        <select id="selectServico" required onchange="aoMudarServico()" class="w-full bg-gray-900 border border-gray-700 text-gray-100 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:border-gold transition">
          <option value="">Carregando serviços...</option>
        </select>
      </div>

      <!-- 2. SELEÇÃO DE PROFISSIONAL -->
      <div>
        <label for="selectProfissional" class="block text-xs font-bold text-gold uppercase tracking-wider mb-1.5">
          👤 2. Escolha o Profissional
        </label>
        <select id="selectProfissional" required class="w-full bg-gray-900 border border-gray-700 text-gray-100 rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:border-gold transition">
          <option value="">Carregando profissionais...</option>
        </select>
      </div>

      <!-- 3. SELEÇÃO DE DATA -->
      <div>
        <label for="inputData" class="block text-xs font-bold text-gold uppercase tracking-wider mb-1.5">
          📅 3. Selecione a Data
        </label>
        <input type="date" id="inputData" required onchange="carregarHorariosDisponiveis()" class="w-full bg-gray-900 border border-gray-700 text-gold rounded-xl px-3.5 py-3 text-sm focus:outline-none focus:border-gold transition">
      </div>

      <!-- 4. SELEÇÃO DE HORÁRIO -->
      <div>
        <label class="block text-xs font-bold text-gold uppercase tracking-wider mb-1.5">
          ⏰ 4. Selecione o Horário
        </label>
        <div id="gridHorarios" class="grid grid-cols-4 gap-2">
          <!-- Horários gerados via JS -->
        </div>
        <input type="hidden" id="inputHorario" required>
      </div>

      <!-- 5. DADOS DO CLIENTE -->
      <div class="pt-2 border-t border-gray-800 space-y-3">
        <div>
          <label for="inputNome" class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            👤 Seu Nome Completo
          </label>
          <input type="text" id="inputNome" placeholder="Ex: João Silva" required class="w-full bg-gray-900 border border-gray-700 text-gray-100 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-gold transition placeholder:text-gray-600">
        </div>

        <div>
          <label for="inputWhatsapp" class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
            📱 Seu WhatsApp (com DDD)
          </label>
          <input type="tel" id="inputWhatsapp" placeholder="(00) 90000-0000" maxlength="15" required oninput="aplicarMascaraWhatsapp(this)" class="w-full bg-gray-900 border border-gray-700 text-gray-100 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-gold transition placeholder:text-gray-600">
        </div>
      </div>

      <!-- RESUMO & BOTÃO -->
      <div class="pt-3">
        <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-800 mb-4 flex justify-between items-center text-xs">
          <span class="text-gray-400">Total a pagar no local:</span>
          <span id="labelValorTotal" class="text-lg font-bold text-gold">R$ 0,00</span>
        </div>

        <button type="submit" id="btnConfirmar" class="w-full bg-gold hover:bg-amber-500 text-gray-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 uppercase tracking-wider text-sm">
          ✅ Confirmar Agendamento
        </button>
      </div>

    </form>
  </main>

  <script>
    const HORARIOS_PADRAO = ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'];
    let servicosCache = [];
    let profissionaisCache = [];

    document.addEventListener('DOMContentLoaded', () => {
      // Ajusta data mínima para hoje
      const hoje = new Date().toISOString().split('T')[0];
      const inputData = document.getElementById('inputData');
      inputData.min = hoje;
      inputData.value = hoje;

      // Carrega dados dinâmicos das tabelas
      inicializarDados();
    });

    async function inicializarDados() {
      await Promise.all([carregarServicos(), carregarProfissionais()]);
      carregarHorariosDisponiveis();
    }

    // 1. Carrega serviços salvos da API ou LocalStorage
    async function carregarServicos() {
      const select = document.getElementById('selectServico');
      
      try {
        const res = await fetch('/api/servicos');
        if (res.ok) {
          servicosCache = await res.json();
        } else {
          throw new Error();
        }
      } catch (err) {
        servicosCache = JSON.parse(localStorage.getItem('servicos') || '[]');
      }

      if (!Array.isArray(servicosCache) || servicosCache.length === 0) {
        select.innerHTML = '<option value="">Nenhum serviço cadastrado</option>';
        document.getElementById('labelValorTotal').innerText = 'R$ 0,00';
        return;
      }

      select.innerHTML = servicosCache.map(s => {
        const valor = parseFloat(s.preco || s.valor || 0);
        const valorFmt = `R$ ${valor.toFixed(2).replace('.', ',')}`;
        return `<option value="${s.id || s.nome}" data-nome="${s.nome}" data-preco="${valor}">${s.nome} - ${valorFmt}</option>`;
      }).join('');

      aoMudarServico();
    }

    // 2. Carrega profissionais salvos da API ou LocalStorage
    async function carregarProfissionais() {
      const select = document.getElementById('selectProfissional');

      try {
        const res = await fetch('/api/profissionais');
        if (res.ok) {
          profissionaisCache = await res.json();
        } else {
          throw new Error();
        }
      } catch (err) {
        profissionaisCache = JSON.parse(localStorage.getItem('profissionais') || '[]');
      }

      if (!Array.isArray(profissionaisCache) || profissionaisCache.length === 0) {
        select.innerHTML = '<option value="">Nenhum profissional disponível</option>';
        return;
      }

      select.innerHTML = profissionaisCache.map(p => {
        const especialidade = p.especialidade ? ` (${p.especialidade})` : '';
        return `<option value="${p.id || p.nome}" data-nome="${p.nome}">${p.nome}${especialidade}</option>`;
      }).join('');
    }

    // Atualiza o valor exibido no resumo
    function aoMudarServico() {
      const select = document.getElementById('selectServico');
      const option = select.options[select.selectedIndex];
      if (!option) return;

      const preco = parseFloat(option.getAttribute('data-preco') || 0);
      document.getElementById('labelValorTotal').innerText = `R$ ${preco.toFixed(2).replace('.', ',')}`;
    }

    // Renderiza grid de horários
    async function carregarHorariosDisponiveis() {
      const grid = document.getElementById('gridHorarios');
      const dataSel = document.getElementById('inputData').value;
      document.getElementById('inputHorario').value = '';

      if (!dataSel) {
        grid.innerHTML = '<p class="col-span-4 text-xs text-center text-gray-500 py-2">Selecione uma data</p>';
        return;
      }

      let agendamentosDoDia = [];
      try {
        const res = await fetch(`/api/agendamentos?data=${dataSel}`);
        if (res.ok) agendamentosDoDia = await res.json();
      } catch (e) {
        agendamentosDoDia = [];
      }

      const ocupados = agendamentosDoDia
        .filter(a => (a.status || '').toLowerCase() !== 'cancelado')
        .map(a => a.horario);

      grid.innerHTML = HORARIOS_PADRAO.map(h => {
        const isOcupado = ocupados.includes(h);
        return `
          <button type="button" 
                  onclick="selecionarHorario(this, '${h}')"
                  class="slot-btn text-xs py-2 px-1 rounded-lg border border-gray-700 bg-gray-900 text-gray-300 hover:border-gold hover:text-gold ${isOcupado ? 'disabled' : ''}">
            ${h}
          </button>
        `;
      }).join('');
    }

    function selecionarHorario(btn, horario) {
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('inputHorario').value = horario;
    }

    // Máscara para WhatsApp: (XX) XXXXX-XXXX
    function aplicarMascaraWhatsapp(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);

      if (v.length > 6) {
        input.value = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
      } else if (v.length > 2) {
        input.value = `(${v.slice(0, 2)}) ${v.slice(2)}`;
      } else if (v.length > 0) {
        input.value = `(${v.slice(0, 2)}`;
      } else {
        input.value = '';
      }
    }

    // Envio do formulário
    async function confirmarAgendamento(e) {
      e.preventDefault();

      const horario = document.getElementById('inputHorario').value;
      if (!horario) {
        mostrarToast('Por favor, selecione um horário!', 'erro');
        return;
      }

      const selectServico = document.getElementById('selectServico');
      const optionServico = selectServico.options[selectServico.selectedIndex];

      const selectProfissional = document.getElementById('selectProfissional');
      const optionProfissional = selectProfissional.options[selectProfissional.selectedIndex];

      const novoAgendamento = {
        cliente: document.getElementById('inputNome').value.trim(),
        whatsapp: document.getElementById('inputWhatsapp').value.trim(),
        servico: optionServico ? optionServico.getAttribute('data-nome') : selectServico.value,
        preco: optionServico ? parseFloat(optionServico.getAttribute('data-preco') || 0) : 0,
        barbeiro: optionProfissional ? optionProfissional.getAttribute('data-nome') : selectProfissional.value,
        data: document.getElementById('inputData').value,
        horario: horario,
        status: 'Agendado'
      };

      const btn = document.getElementById('btnConfirmar');
      btn.disabled = true;
      btn.innerText = 'Agendando...';

      try {
        const response = await fetch('/api/agendamentos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novoAgendamento)
        });

        if (!response.ok) throw new Error('Erro na API');

        mostrarToast('Agendamento realizado com sucesso!');
        setTimeout(() => window.location.href = 'painel.html', 1500);

      } catch (err) {
        // Fallback para armazenar localmente caso não haja servidor backend
        const salvos = JSON.parse(localStorage.getItem('agendamentos') || '[]');
        salvos.push(novoAgendamento);
        localStorage.setItem('agendamentos', JSON.stringify(salvos));

        mostrarToast('Agendamento realizado com sucesso (Local)!');
        setTimeout(() => window.location.href = 'painel.html', 1500);
      }
    }

    function mostrarToast(msg, tipo = 'sucesso') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = tipo === 'erro'
        ? 'fixed top-5 right-5 z-50 bg-red-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm'
        : 'fixed top-5 right-5 z-50 bg-emerald-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
