<!-- CABEÇALHO BARBERFLOW PREMIUM (VERSÃO FINAL COM .JPEG) -->
<div style="
    background-color: #121212; /* Fundo escuro */
    padding: 20px 30px;
    border-radius: 12px;
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 30px; 
    flex-wrap: wrap; 
    gap: 20px; 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
">
    
    <!-- Lado Esquerdo: Logo + Título -->
    <div style="display: flex; align-items: center; gap: 18px;">
        <!-- Logo Oficial com extensão .jpeg corrigida -->
        <img src="logo-barbearia.jpeg" alt="BarberFlow" style="
            width: 60px; 
            height: 60px; 
            object-fit: cover; 
            border-radius: 12px; 
            border: 2px solid #d4af37; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            display: block;
            background-color: #222;
        ">
        
        <!-- Textos do Cabeçalho -->
        <div>
            <div style="
                font-size: 12px; 
                color: #d4af37; 
                font-weight: 700; 
                letter-spacing: 2px; 
                text-transform: uppercase; 
                margin-bottom: 4px;
            ">
                BarberFlow SaaS
            </div>
            <h1 style="
                color: #ffffff; 
                font-size: 28px; 
                margin: 0; 
                font-weight: 800; 
                line-height: 1;
                letter-spacing: -0.5px;
            ">
                Painel da Barbearia
            </h1>
            <p style="
                color: #bbbbbb; 
                font-size: 15px; 
                margin: 6px 0 0 0; 
                font-weight: 400;
            ">
                Gerencie os horarios e o status dos atendimentos
            </p>
        </div>
    </div>

    <!-- Lado Direito: Filtro de Data -->
    <div style="display: flex; align-items: center; gap: 10px;">
        <input type="date" style="padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff;">
        <button style="padding: 10px 16px; border-radius: 8px; background: #d4af37; color: #121212; border: none; font-weight: bold; cursor: pointer;">
            Filtrar
        </button>
    </div>

</div>
