<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Serviços | SmartBarber</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { gold: '#D4AF37', darkBg: '#111111', darkCard: '#1a1a1a' }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen p-4 sm:p-6 relative">

  <!-- Container de Notificações Toast -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-800 pb-4 gap-4">
      <div class="flex items-center gap-3.5">
        <img src="logo-barbearia.jpeg" alt="Logo SmartBarber" class="w-12 h-12 rounded-xl object-cover border border-gold/30 shadow-md shrink-0" onerror="this.style.display='none'">
        <div>
          <span class="text-[10px] font-bold tracking-widest text-gold uppercase block leading-none mb-1">SMARTBARBER</span>
          <h1 class="text-xl sm:text-2xl font-bold text-gold leading-tight">Gestão de Serviços e Preços</h1>
          <p class="text-gray-400 text-xs sm:text-sm">Cadastre, edite e gerencie os serviços oferecidos na barbearia.</p>
        </div>
      </div>
      
      <!-- Navegação rápida -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <a href="profissionais.html" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/40 font-semibold px-3 py-2 rounded-lg text-xs transition flex items-center gap-1">
          💈 Profissionais
        </a>
        <a href="painel.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center gap-1">
          ← Voltar ao Painel
        </a>
      </div>
    </header>

    <!-- Formulário para Adicionar / Editar Serviço -->
    <section class="bg-darkCard p-5 rounded-xl border border-gray-800 shadow-lg">
      <h2 id="tituloForm" class="text-sm font-bold text-gold mb-3 flex items-center gap-2">
        <span>➕</span> Adicionar Novo Serviço
      </h2>
      <form id="formServico" onsubmit="salvarServico(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <input type="hidden" id="servicoId">
        
        <input type="text" id="nomeServico" placeholder="Ex: Corte + Barba" required class="sm:col-span-2 bg-darkBg border border-gray-700 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-gold">
        
        <input type="number" id="valorServico" step="0.01" min="0" placeholder="Valor (R$) Ex: 45.00" required class="sm:col-span-1 bg-darkBg border border-gray-700 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-gold">
        
        <div class="sm:col-span-1 flex gap-2">
          <button type="submit" id="btnSalvar" class="w-full bg-gold hover:bg-yellow-600 text-black font-bold px-4 py-2 rounded-lg text-xs transition cursor-pointer">
            Cadastrar
          </button>
          <button type="button" id="btnCancelarEdicao" onclick="cancelarEdicao()" class="hidden bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-3 py-2 rounded-lg text-xs transition cursor-pointer">
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- Tabela de Serviços Atuais -->
    <section class="bg-darkCard p-5 rounded-xl border border-gray-800 space-y-4 shadow-lg">
      <h2 class="text-sm font-bold text-gray-200 flex items-center gap-2">
        📋 Tabela de Serviços Cadastrados
      </h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm">
          <thead>
            <tr class="text-gray-400 border-b border-gray-800 uppercase text-[11px]">
              <th class="py-2.5 px-3">Serviço</th>
              <th class="py-2.5 px-3">Valor</th>
              <th class="py-2.5 px-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaServicosBody" class="divide-y divide-gray-800 text-gray-300">
            <!-- Renderizado via JS -->
          </tbody>
        </table>
        
        <div id="emptyServicos" class="text-center py-6 text-gray-500 text-xs" style="display: none;">
          Nenhum serviço cadastrado até o momento.
        </div>
      </div>
    </section>

  </div>

  <script>
    let servicosCache = [];

    function mostrarToast(mensagem, tipo = 'sucesso') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const corFundo = tipo === 'sucesso' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-300' : 'bg-red-950/90 border-red-500/50 text-red-300';
      
      toast.className = `pointer-events-auto px-4 py-3 rounded-lg border shadow-xl text-xs font-medium backdrop-blur-md transition-all duration-300 translate-y-2 opacity-0 flex items-center gap-2 ${corFundo}`;
      toast.innerHTML = `<span>${mensagem}</span>`;
      container.appendChild(toast);

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function carregarServicos() {
      const tbody = document.getElementById('tabelaServicosBody');
      const emptyState = document.getElementById('emptyServicos');
      
      try {
        const res = await fetch('/api/servicos');
        if (!res.ok) throw new Error('Falha na requisição');
        servicosCache = await res.json();

        tbody.innerHTML = '';

        if (!servicosCache || servicosCache.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        servicosCache.forEach(s => {
          const precoNum = parseFloat(s.preco || 0);
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-gray-800/40 transition';
          tr.innerHTML = `
            <td class="py-2.5 px-3 font-semibold text-gray-200">${s.nome}</td>
            <td class="py-2.5 px-3 text-emerald-400 font-bold">R$ ${precoNum.toFixed(2).replace('.', ',')}</td>
            <td class="py-2.5 px-3 text-right">
              <div class="flex items-center justify-end gap-2">
                <button onclick="prepararEdicao(${s.id})" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/30 px-2.5 py-1 rounded text-xs transition cursor-pointer">
                  Editar
                </button>
                <button onclick="deletarServico(${s.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded text-xs transition cursor-pointer">
                  Excluir
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-red-400 font-semibold">Erro ao carregar serviços.</td></tr>`;
      }
    }

    function prepararEdicao(id) {
      const servico = servicosCache.find(s => s.id === id);
      if (!servico) return;

      document.getElementById('servicoId').value = servico.id;
      document.getElementById('nomeServico').value = servico.nome;
      document.getElementById('valorServico').value = servico.preco;

      document.getElementById('tituloForm').innerHTML = '<span>✏️</span> Editar Serviço';
      document.getElementById('btnSalvar').innerText = 'Atualizar';
      document.getElementById('btnCancelarEdicao').classList.remove('hidden');
    }

    function cancelarEdicao() {
      document.getElementById('formServico').reset();
      document.getElementById('servicoId').value = '';
      document.getElementById('tituloForm').innerHTML = '<span>➕</span> Adicionar Novo Serviço';
      document.getElementById('btnSalvar').innerText = 'Cadastrar';
      document.getElementById('btnCancelarEdicao').classList.add('hidden');
    }

    async function salvarServico(e) {
      e.preventDefault();
      const id = document.getElementById('servicoId').value;
      const nome = document.getElementById('nomeServico').value.trim();
      const preco = parseFloat(document.getElementById('valorServico').value);

      if (!nome || isNaN(preco)) {
        mostrarToast('Preencha os campos corretamente.', 'erro');
        return;
      }

      const url = id ? `/api/servicos/${id}` : '/api/servicos';
      const method = id ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, preco })
        });

        if (res.ok) {
          mostrarToast(id ? 'Serviço atualizado com sucesso!' : 'Serviço cadastrado com sucesso!', 'sucesso');
          cancelarEdicao();
          carregarServicos();
        } else {
          mostrarToast('Erro ao salvar serviço.', 'erro');
        }
      } catch (err) {
        console.error(err);
        mostrarToast('Erro ao se comunicar com o servidor.', 'erro');
      }
    }

    async function deletarServico(id) {
      if (!confirm('Tem certeza de que deseja excluir este serviço?')) return;

      try {
        const res = await fetch(`/api/servicos/${id}`, { method: 'DELETE' });
        if (res.ok) {
          mostrarToast('Serviço excluído com sucesso!', 'sucesso');
          carregarServicos();
        } else {
          mostrarToast('Erro ao excluir serviço.', 'erro');
        }
      } catch (err) {
        console.error(err);
        mostrarToast('Erro ao comunicar com o servidor.', 'erro');
      }
    }

    carregarServicos();
  </script>
</body>
</html>
