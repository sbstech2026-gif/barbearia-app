<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Serviços - BarberFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --accent-color: #d4af37;
            --accent-hover: #c5a028;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2d3139;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header h1 { font-size: 22px; color: var(--accent-color); }
        .header p { font-size: 13px; color: var(--text-muted); }

        .btn-back {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .card h2 { font-size: 16px; margin-bottom: 15px; color: var(--text-main); }

        .form-group {
            display: grid;
            grid-template-columns: 2fr 1fr 120px;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .form-group { grid-template-columns: 1fr; }
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-accent:hover { background-color: var(--accent-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-size: 13px; }
        .valor-td { color: var(--success); font-weight: 600; }

        .btn-del {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Gestão de Serviços e Preços</h1>
                <p>Cadastre e altere os valores cobrados na barbearia</p>
            </div>
            <a href="/admin" class="btn-back">← Voltar à Agenda</a>
        </div>

        <!-- Formulário para Novo Serviço -->
        <div class="card">
            <h2>➕ Adicionar Novo Serviço</h2>
            <form id="formServico" class="form-group">
                <input type="text" id="nomeServico" placeholder="Ex: Corte + Barba" required>
                <input type="number" id="valorServico" step="0.01" placeholder="Valor (R$) Ex: 45.00" required>
                <button type="submit" class="btn-accent">Cadastrar</button>
            </form>
        </div>

        <!-- Lista de Serviços -->
        <div class="card">
            <h2>📋 Tabela de Serviços Atuais</h2>
            <table>
                <thead>
                    <tr>
                        <th>SERVIÇO</th>
                        <th>VALOR</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabelaServicos">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Carregando serviços...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarServicos() {
            const tbody = document.getElementById('tabelaServicos');
            try {
                const res = await fetch('/api/servicos');
                const servicos = await res.json();

                tbody.innerHTML = '';
                if (servicos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Nenhum serviço cadastrado.</td></tr>`;
                    return;
                }

                servicos.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${s.nome}</strong></td>
                        <td class="valor-td">R$ ${parseFloat(s.valor).toFixed(2).replace('.', ',')}</td>
                        <td>
                            <button class="btn-del" onclick="excluirServico('${s.id}')">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--danger);">Erro ao carregar serviços.</td></tr>`;
            }
        }

        document.getElementById('formServico').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nomeServico').value;
            const valor = document.getElementById('valorServico').value;

            await fetch('/api/servicos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, valor })
            });

            document.getElementById('nomeServico').value = '';
            document.getElementById('valorServico').value = '';
            carregarServicos();
        });

        async function excluirServico(id) {
            if (confirm('Deseja realmente remover este serviço?')) {
                await fetch(`/api/servicos/${id}`, { method: 'DELETE' });
                carregarServicos();
            }
        }

        carregarServicos();
    </script>
</body>
</html>
