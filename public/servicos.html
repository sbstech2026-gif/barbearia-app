<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Serviços | BarberFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { gold: '#D4AF37', darkBg: '#111111', darkCard: '#1a1a1a' }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen p-4 sm:p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-gold">Gestão de Serviços e Preços</h1>
        <p class="text-gray-400 text-xs sm:text-sm">Cadastre e altere os valores cobrados na barbearia</p>
      </div>
      <!-- Botão corrigido para apontar para o Painel de Gerenciamento -->
      <a href="painel.html" class="inline-flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
        ← Voltar ao Painel
      </a>
    </header>

    <!-- Formulário para Adicionar Novo Serviço -->
    <section class="bg-darkCard p-5 rounded-xl border border-gray-800">
      <h2 class="text-sm font-bold text-gold mb-3 flex items-center gap-2">
        <span>+</span> Adicionar Novo Serviço
      </h2>
      <form id="formServico" onsubmit="adicionarServico(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input type="text" id="nomeServico" placeholder="Ex: Corte + Barba" required class="sm:col-span-1 bg-darkBg border border-gray-700 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-gold">
        <input type="number" id="valorServico" step="0.01" placeholder="Valor (R$) Ex: 45.00" required class="sm:col-span-1 bg-darkBg border border-gray-700 text-white rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-gold">
        <button type="submit" class="bg-gold hover:bg-yellow-600 text-black font-bold px-4 py-2 rounded-lg text-xs transition cursor-pointer">
          Cadastrar
        </button>
      </form>
    </section>

    <!-- Tabela de Serviços Atuais -->
    <section class="bg-darkCard p-5 rounded-xl border border-gray-800 space-y-4">
      <h2 class="text-sm font-bold text-gray-200 flex items-center gap-2">
        📋 Tabela de Serviços Atuais
      </h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm">
          <thead>
            <tr class="text-gray-400 border-b border-gray-800 uppercase text-[11px]">
              <th class="py-2.5 px-3">Serviço</th>
              <th class="py-2.5 px-3">Valor</th>
              <th class="py-2.5 px-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaServicosBody" class="divide-y divide-gray-800 text-gray-300">
            <!-- Renderizado via JS -->
          </tbody>
        </table>
        
        <div id="emptyServicos" class="text-center py-6 text-gray-500 text-xs" style="display: none;">
          Nenhum serviço cadastrado até ao momento.
        </div>
      </div>
    </section>

  </div>

  <script>
    async function carregarServicos() {
      const tbody = document.getElementById('tabelaServicosBody');
      const emptyState = document.getElementById('emptyServicos');
      
      try {
        const res = await fetch('/api/servicos');
        if (!res.ok) throw new Error('Falha na requisição');
        const servicos = await res.json();

        tbody.innerHTML = '';

        if (!servicos || servicos.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        servicos.forEach(s => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="py-2.5 px-3 font-semibold text-gray-200">${s.nome}</td>
            <td class="py-2.5 px-3 text-emerald-400 font-bold">R$ ${parseFloat(s.preco).toFixed(2).replace('.', ',')}</td>
            <td class="py-2.5 px-3 text-right">
              <button onclick="deletarServico(${s.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded text-xs transition">
                Excluir
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-red-400 font-semibold">Erro ao carregar serviços.</td></tr>`;
      }
    }

    async function adicionarServico(e) {
      e.preventDefault();
      const nome = document.getElementById('nomeServico').value;
      const preco = parseFloat(document.getElementById('valorServico').value);

      try {
        const res = await fetch('/api/servicos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, preco })
        });

        if (res.ok) {
          document.getElementById('formServico').reset();
          carregarServicos();
        }
      } catch (err) {
        console.error('Erro ao cadastrar serviço:', err);
      }
    }

    async function deletarServico(id) {
      if (!confirm('Tem a certeza que deseja excluir este serviço?')) return;

      try {
        const res = await fetch(`/api/servicos/${id}`, { method: 'DELETE' });
        if (res.ok) carregarServicos();
      } catch (err) {
        console.error('Erro ao deletar serviço:', err);
      }
    }

    carregarServicos();
  </script>
</body>
</html>
