<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financeiro | BarberFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { gold: '#D4AF37', darkBg: '#111111', darkCard: '#1a1a1a' }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen p-4 sm:p-6">
  <div class="max-w-7xl mx-auto w-full">
    
    <!-- Header com Botão de Voltar -->
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
      <div>
        <span class="text-[10px] font-bold text-gold uppercase tracking-wider block">BarberFlow SaaS</span>
        <h1 class="text-xl sm:text-2xl font-bold text-gold">Dashboard Financeiro</h1>
        <p class="text-gray-400 text-xs sm:text-sm">Visão geral de faturamento e métricas da barbearia.</p>
      </div>
      <a href="painel.html" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition flex items-center gap-2">
        ⬅️ Voltar à Agenda
      </a>
    </header>

    <!-- Cards de Resumo Financeiro -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-darkCard p-4 rounded-xl border border-gray-800">
        <span class="text-gray-400 text-xs block mb-1">Faturamento Hoje</span>
        <h2 class="text-2xl font-bold text-emerald-400">R$ 0,00</h2>
      </div>
      <div class="bg-darkCard p-4 rounded-xl border border-gray-800">
        <span class="text-gray-400 text-xs block mb-1">Faturamento Mensal</span>
        <h2 class="text-2xl font-bold text-gold">R$ 0,00</h2>
      </div>
      <div class="bg-darkCard p-4 rounded-xl border border-gray-800">
        <span class="text-gray-400 text-xs block mb-1">Cortes Concluídos</span>
        <h2 class="text-2xl font-bold text-blue-400">0</h2>
      </div>
    </div>

  </div>
</body>
</html>
