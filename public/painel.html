<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Barbearia - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Topo */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand h1 {
            color: #d4af37;
            font-size: 22px;
            font-weight: 700;
        }

        .brand p {
            color: #71717a;
            font-size: 13px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls label {
            font-size: 13px;
            color: #a1a1aa;
        }

        input[type="date"] {
            background-color: #18181b;
            border: 1px solid #27272a;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            color-scheme: dark;
        }

        .btn-filter {
            background-color: #d4af37;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-clear {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background-color: #ef4444;
            color: #ffffff;
        }

        /* Tabela */
        .table-container {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        thead {
            background-color: #0f1015;
            border-bottom: 1px solid #27272a;
        }

        th {
            padding: 14px 16px;
            color: #d4af37;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #27272a;
            color: #e4e4e7;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            background-color: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #71717a;
        }

        .btn-whats-app {
            color: #22c55e;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Painel da Barbearia</h1>
                <p>Gerencie os horários e o status dos atendimentos</p>
            </div>

            <div class="controls">
                <label for="filtroData">Data:</label>
                <input type="date" id="filtroData">
                <button class="btn-filter" onclick="carregarAgendamentos()">Filtrar</button>
                <button class="btn-clear" onclick="limparTestes()">🗑️ Limpar Testes</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>WhatsApp</th>
                        <th>Serviço</th>
                        <th>Barbeiro</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <tr>
                        <td colspan="7" class="empty-state">Carregando agendamentos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configura a data de hoje por padrão no input
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('filtroData').value = hoje;

        async function carregarAgendamentos() {
            const dataSelecionada = document.getElementById('filtroData').value;
            const tabelaCorpo = document.getElementById('tabelaCorpo');

            try {
                const res = await fetch(`/api/agendamentos?data=${dataSelecionada}`);
                const agendamentos = await res.json();

                tabelaCorpo.innerHTML = '';

                if (agendamentos.length === 0) {
                    tabelaCorpo.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">Nenhum agendamento encontrado para esta data.</td>
                        </tr>
                    `;
                    return;
                }

                agendamentos.forEach(item => {
                    const dataFormatada = item.data ? item.data.split('-').reverse().join('/') : '-';
                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td><strong>${item.horario || '-'}</strong></td>
                        <td>${dataFormatada}</td>
                        <td>${item.cliente || '-'}</td>
                        <td>
                            <a class="btn-whats-app" href="https://wa.me/55${item.whatsapp}" target="_blank">
                                📱 ${item.whatsapp || '-'}
                            </a>
                        </td>
                        <td>${item.servico || '-'}</td>
                        <td>${item.barbeiro || '-'}</td>
                        <td><span class="status-badge">${item.status || 'Pendente'}</span></td>
                    `;

                    tabelaCorpo.appendChild(tr);
                });

            } catch (err) {
                console.error('Erro ao carregar dados:', err);
                tabelaCorpo.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state" style="color: #ef4444;">Erro ao carregar agendamentos do servidor.</td>
                    </tr>
                `;
            }
        }

        async function limparTestes() {
            if (confirm("Deseja realmente apagar os agendamentos de teste?")) {
                try {
                    const res = await fetch('/api/limpar-testes', { method: 'POST' });
                    const result = await res.json();
                    alert(result.mensagem || "Concluído!");
                    carregarAgendamentos();
                } catch (err) {
                    alert("Erro ao conectar com o servidor para limpar registros.");
                }
            }
        }

        // Carrega os dados ao abrir a página
        carregarAgendamentos();
    </script>
</body>
</html>
