<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBarber - Painel da Agenda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA820A',
            darkBg: '#121212',
            cardBg: '#1E1E24'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans">

  <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-emerald-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm transition-all duration-300">
    Mensagem aqui!
  </div>

  <div class="max-w-7xl mx-auto px-4 py-8">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-cardBg p-6 rounded-2xl border border-gold/20 shadow-xl">
      <div class="flex items-center gap-4">
        <img src="logo-barbearia.jpeg" alt="Logo Barbearia" class="w-14 h-14 rounded-xl object-cover border border-gold/40 shadow-md" onerror="this.onerror=null; this.src='banner-barbearia.jpeg';">
        <div>
          <p class="text-xs uppercase tracking-widest text-gold font-semibold">SMARTBARBER</p>
          <h1 class="text-2xl font-bold text-gold">Agenda de Atendimentos</h1>
          <p class="text-xs text-gray-400">Acompanhe os horários, status e fluxo de clientes em tempo real.</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <a href="servicos.html" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/40 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition">⚙️ Serviços</a>
        <a href="profissionais.html" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/40 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition">💈 Profissionais</a>
        <a href="financeiro.html" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/40 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition">📊 Financeiro</a>
        <button type="button" onclick="limparAgenda()" class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-700/50 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition cursor-pointer">🗑️ Limpar Agenda</button>
      </div>
    </div>

    <div class="bg-cardBg p-4 rounded-xl border border-gold/20 mb-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-lg">📅</span>
        <h2 class="font-bold text-gray-200">Atendimentos</h2>
      </div>
      <div class="flex items-center gap-2">
        <input type="date" id="filtroData" class="bg-gray-900 border border-gray-700 text-gold rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gold">
        <button type="button" onclick="carregarAgendamentos()" class="bg-gold hover:bg-amber-500 text-gray-950 font-bold px-4 py-2 rounded-lg text-sm transition">Filtrar</button>
      </div>
    </div>

    <div class="bg-cardBg rounded-xl border border-gold/20 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-900/80 text-gold uppercase text-xs tracking-wider border-b border-gold/20">
            <tr>
              <th class="py-3 px-4">Horário</th>
              <th class="py-3 px-4">Data</th>
              <th class="py-3 px-4">Cliente</th>
              <th class="py-3 px-4">WhatsApp</th>
              <th class="py-3 px-4">Serviço</th>
              <th class="py-3 px-4">Valor</th>
              <th class="py-3 px-4">Barbeiro</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-gray-800">
            <tr>
              <td colspan="9" class="text-center py-6 text-gray-500">Carregando agendamentos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let listaAgendamentosMemoria = [];

    document.addEventListener('DOMContentLoaded', () => {
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('filtroData').value = hoje;
      carregarAgendamentos();
    });

    function mostrarToast(mensagem, tipo = 'sucesso') {
      const toast = document.getElementById('toast');
      toast.innerText = mensagem;
      toast.className = tipo === 'erro' 
        ? 'fixed top-5 right-5 z-50 bg-red-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm transition-all duration-300'
        : 'fixed top-5 right-5 z-50 bg-emerald-600 text-white font-bold px-4 py-3 rounded-lg shadow-lg text-sm transition-all duration-300';
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function carregarAgendamentos() {
      const data = document.getElementById('filtroData').value;
      const tabela = document.getElementById('tabelaCorpo');

      try {
        const url = data ? `/api/agendamentos?data=${data}` : '/api/agendamentos';
        const response = await fetch(url);
        listaAgendamentosMemoria = await response.json();

        if (!Array.isArray(listaAgendamentosMemoria) || listaAgendamentosMemoria.length === 0) {
          tabela.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-500">Nenhum agendamento encontrado para esta data.</td></tr>`;
          return;
        }

        tabela.innerHTML = listaAgendamentosMemoria.map((item, index) => {
          const nomeCliente = item.cliente || item.clienteNome || item.nome || 'Cliente';
          const whatsapp = item.whatsapp || item.clienteWhatsapp || '';
          const servico = item.servico || item.servicoNome || '-';
          const barbeiro = item.barbeiro || item.barbeiroNome || '-';
          const valorFormatado = item.preco ? `R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}` : 'R$ 0,00';
          const status = item.status || 'Agendado';

          const statusLower = status.toLowerCase();
          const isConcluido = statusLower.includes('conclu') || statusLower.includes('atend');
          const isCancelado = statusLower.includes('cancel');

          let badgeStatus = '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full text-xs font-semibold">⏱️ Agendado</span>';

          if (isConcluido) {
            badgeStatus = '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full text-xs font-semibold">✅ Concluído</span>';
          } else if (isCancelado) {
            badgeStatus = '<span class="bg-red-500/10 text-red-400 border border-red-700/30 px-2.5 py-1 rounded-full text-xs font-semibold">❌ Cancelado</span>';
          }

          const linkWhats = whatsapp ? `https://wa.me/55${whatsapp.replace(/\D/g, '')}` : '#';

          const botaoConcluir = isConcluido
            ? `<button type="button" disabled class="bg-gray-800 text-gray-500 border border-gray-700 px-2.5 py-1 rounded text-xs font-semibold cursor-not-allowed" title="Já concluído">✅ Concluído</button>`
            : `<button type="button" onclick="alterarStatusPorIndice(${index}, 'Concluido')" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 border border-emerald-500/40 px-2.5 py-1 rounded text-xs transition cursor-pointer font-semibold">Concluir</button>`;

          const botaoCancelar = isCancelado
            ? `<button type="button" disabled class="bg-gray-800 text-gray-500 border border-gray-700 px-2 py-1 rounded text-xs cursor-not-allowed" title="Já cancelado">❌ Cancelado</button>`
            : `<button type="button" onclick="alterarStatusPorIndice(${index}, 'Cancelado')" class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-700/50 px-2 py-1 rounded text-xs transition cursor-pointer">Cancelar</button>`;

          return `
            <tr class="hover:bg-gray-800/40 transition">
              <td class="py-3 px-4 font-bold text-gold">${item.horario || '--:--'}</td>
              <td class="py-3 px-4 text-xs text-gray-400">${item.data}</td>
              <td class="py-3 px-4 font-semibold text-white uppercase">${nomeCliente}</td>
              <td class="py-3 px-4">
                ${whatsapp ? `<a href="${linkWhats}" target="_blank" class="text-emerald-400 hover:underline text-xs flex items-center gap-1">📱 ${whatsapp}</a>` : '-'}
              </td>
              <td class="py-3 px-4 text-xs font-medium text-gray-300 uppercase">${servico}</td>
              <td class="py-3 px-4 font-bold text-emerald-400 text-xs">${valorFormatado}</td>
              <td class="py-3 px-4 text-xs text-gray-300 uppercase">${barbeiro}</td>
              <td class="py-3 px-4">${badgeStatus}</td>
              <td class="py-3 px-4">
                <div class="flex items-center justify-center gap-1.5">
                  ${whatsapp ? `<a href="https://wa.me/55${whatsapp.replace(/\D/g, '')}?text=Ol\%C3\%A1\%20${encodeURIComponent(nomeCliente)},%20confirmamos%20seu%20hor%C3%A1rio%20hoje!" target="_blank" class="bg-emerald-950/60 hover:bg-emerald-800 text-emerald-300 border border-emerald-700/50 px-2 py-1 rounded text-xs transition">📅 Lembrete</a>` : ''}
                  
                  ${botaoConcluir}
                  ${botaoCancelar}
                </div>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        tabela.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-red-400">Erro ao carregar os agendamentos.</td></tr>`;
      }
    }

    async function alterarStatusPorIndice(index, novoStatus) {
      const item = listaAgendamentosMemoria[index];
      if (!item) {
        mostrarToast('Agendamento não localizado na memória.', 'erro');
        return;
      }

      const itemId = item.id || item.rowid || '';

      try {
        const response = await fetch(`/api/agendamentos/${itemId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            id: itemId,
            status: novoStatus, 
            cliente: item.cliente,
            horario: item.horario,
            data: item.data
          })
        });

        if (response.ok) {
          mostrarToast(novoStatus === 'Concluido' ? 'Atendimento concluído!' : 'Atendimento cancelado!');
          carregarAgendamentos();
        } else {
          let msg = 'Erro ao atualizar no servidor.';
          try {
            const errBody = await response.json();
            if (errBody && errBody.error) msg = `Erro: ${errBody.error}`;
          } catch (_) {}
          console.error('Erro ao atualizar (status ' + response.status + '):', msg);
          mostrarToast(msg, 'erro');
        }
      } catch (err) {
        console.error('Erro na requisição:', err);
        mostrarToast('Erro na conexão com o servidor.', 'erro');
      }
    }

    async function limparAgenda() {
      if (!confirm('Tem certeza que deseja apagar os agendamentos do dia selecionado?')) return;

      const data = document.getElementById('filtroData').value;
      try {
        const url = data ? `/api/agendamentos?data=${data}` : '/api/agendamentos';
        const response = await fetch(url, { method: 'DELETE' });

        if (response.ok) {
          mostrarToast('Agenda limpa com sucesso!');
          carregarAgendamentos();
        } else {
          mostrarToast('Erro ao limpar agenda', 'erro');
        }
      } catch (err) {
        mostrarToast('Erro ao conectar ao servidor', 'erro');
      }
    }
  </script>
</body>
</html>
