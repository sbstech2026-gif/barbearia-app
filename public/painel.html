<!DOCTYPE html>

<head>

  <title>SmartBarber - Painel da Agenda</title>

  <!-- Configurações do PWA para o Painel do Barbeiro -->
  <link rel="manifest" href="/manifest-barbeiro.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA820A',
            darkBg: '#121212',
            cardBg: '#1E1E24'
          }
        }
      }
    }
  </script>
  <style>
    .nav-tab {

      cursor: pointer;
    }

    .nav-tab-active { background: #D4AF37; color: #121212; pointer-events: none; }
  </style>
</head>
