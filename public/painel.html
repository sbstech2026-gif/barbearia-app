<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            color: #d4af37;
            font-size: 22px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 24px;
            font-weight: 700;
            color: #d4af37;
        }

        .table-container {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px;
            border-bottom: 1px solid #222;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-right: 5px;
        }

        .btn-wpp {
            background-color: #25d366;
            color: #fff;
        }

        .btn-lembrete {
            background-color: #128c7e;
            color: #fff;
        }

        .btn-clear {
            background-color: #3a1515;
            color: #ff5555;
            border: 1px solid #552222;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Painel da Barbearia</h1>
            </div>
            <button class="btn-clear" onclick="limparAgenda()">🗑️ Limpar Agenda</button>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>Faturamento Hoje</h3>
                <div class="value" id="faturamentoHoje">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>Faturamento do Mês</h3>
                <div class="value" id="faturamentoMes">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>Barbeiro Destaque</h3>
                <div class="value" id="barbeiroDestaque">-</div>
            </div>
            <div class="card">
                <h3>Serviço Mais Popular</h3>
                <div class="value" id="servicoPopular">-</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>📅 Lista de Atendimentos</h2>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>WhatsApp</th>
                        <th>Serviço</th>
                        <th>Barbeiro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAgendamentos">
                    <!-- Registros inseridos via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarAgendamentos() {
            try {
                const res = await fetch('/api/agendamentos');
                const agendamentos = await res.json();
                
                const tbody = document.getElementById('tabelaAgendamentos');
                tbody.innerHTML = '';

                let totalHoje = 0;
                let totalMes = 0;

                agendamentos.forEach(item => {
                    const numWhats = item.whatsapp.replace(/\D/g, '');
                    
                    // Mensagem do Lembrete Automático
                    const textoLembrete = `Olá ${item.cliente}, passando para lembrar do seu agendamento hoje às ${item.horario} com o barbeiro ${item.barbeiro}. Te esperamos aqui! ✂️💈`;
                    const linkLembrete = `https://api.whatsapp.com/send?phone=55${numWhats}&text=${encodeURIComponent(textoLembrete)}`;
                    const linkContato = `https://api.whatsapp.com/send?phone=55${numWhats}`;

                    totalHoje += parseFloat(item.preco) || 0;
                    totalMes += parseFloat(item.preco) || 0;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${item.horario}</strong></td>
                        <td>${item.data}</td>
                        <td>${item.cliente}</td>
                        <td>${item.whatsapp}</td>
                        <td>${item.servico} (R$ ${item.preco})</td>
                        <td>${item.barbeiro}</td>
                        <td>
                            <a href="${linkContato}" target="_blank" class="btn-action btn-wpp">💬 Whats</a>
                            <a href="${linkLembrete}" target="_blank" class="btn-action btn-lembrete">📅 Enviar Lembrete</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('faturamentoHoje').innerText = `R$ ${totalHoje.toFixed(2)}`;
                document.getElementById('faturamentoMes').innerText = `R$ ${totalMes.toFixed(2)}`;

            } catch (err) {
                console.error('Erro ao carregar lista do painel:', err);
            }
        }

        async function limparAgenda() {
            if (confirm('Deseja realmente limpar todos os agendamentos do painel?')) {
                await fetch('/api/agendamentos', { method: 'DELETE' });
                carregarAgendamentos();
            }
        }

        carregarAgendamentos();
    </script>
</body>
</html>
