<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Atendimentos | BarberFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            darkBg: '#111111',
            darkCard: '#1a1a1a'
          }
        }
      }
    }
  </script>

<!-- Configuração PWA (App Instalável) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso!'))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>



</head>
<body class="bg-darkBg text-gray-100 min-h-screen p-3 sm:p-6 relative">

  <!-- Container de Notificações Toast -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Container Principal -->
  <div class="max-w-7xl mx-auto w-full">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b border-gray-800 pb-4 gap-4">
      <div class="flex items-center gap-3">
        <img src="logo-barbearia.jpeg" alt="BarberFlow" style="width: 50px; height: 50px; object-fit: cover;" class="rounded-xl border border-gray-800 shrink-0" onerror="this.style.display='none'">
        <div>
          <span class="text-[10px] font-bold text-gold uppercase tracking-wider block">BarberFlow SaaS</span>
          <h1 class="text-xl sm:text-2xl font-bold text-gold leading-tight">Agenda de Atendimentos</h1>
          <p class="text-gray-400 text-xs sm:text-sm">Acompanhe os horários, status e fluxo de clientes em tempo real.</p>
        </div>
      </div>
      
      <div class="w-full sm:w-auto flex justify-end gap-2">
        <a href="financeiro.html" target="_blank" class="bg-amber-500/10 hover:bg-amber-500/20 text-gold border border-gold/40 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
          📊 Financeiro
        </a>
        <button onclick="limparAgenda()" class="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-700/50 font-semibold px-3 py-2 rounded-lg text-xs sm:text-sm transition cursor-pointer flex items-center justify-center gap-1.5">
          🗑️ Limpar Agenda
        </button>
      </div>
    </header>

    <!-- Filtro de Data -->
    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-4 bg-darkCard p-3 sm:p-4 rounded-xl border border-gray-800">
      <h2 class="text-base font-bold text-white flex items-center gap-2">📅 Atendimentos</h2>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <input type="date" id="filtroData" class="w-full sm:w-auto bg-darkBg border border-gray-700 text-white rounded-lg px-3 py-2 text-xs sm:text-sm focus:outline-none focus:border-gold [color-scheme:dark]">
        <button onclick="carregarAgendamentos()" class="bg-gold hover:bg-yellow-600 text-black font-semibold px-4 py-2 rounded-lg text-xs sm:text-sm transition cursor-pointer">
          Filtrar
        </button>
      </div>
    </div>

    <!-- Tabela Responsiva -->
    <main class="w-full">
      <div class="bg-darkCard rounded-xl border border-gray-800 shadow-xl overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm text-gray-300 table-auto">
          <thead class="bg-gray-900 text-gold uppercase text-[10px] sm:text-xs border-b border-gray-800">
            <tr>
              <th class="p-3">Horário</th>
              <th class="p-3">Data</th>
              <th class="p-3">Cliente</th>
              <th class="p-3">WhatsApp</th>
              <th class="p-3">Serviço</th>
              <th class="p-3 text-emerald-400">Valor</th>
              <th class="p-3">Barbeiro</th>
              <th class="p-3 text-center">Status</th>
              <th class="p-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaAgendamentos" class="divide-y divide-gray-800">
            <!-- Preenchido via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('filtroData').value = new Date().toISOString().split('T')[0];

    // Mapeamento forçado pelos nomes exatos do formulário
    function extrairOuMapearPreco(servicoStr) {
      if (!servicoStr) return 0.00;

      const nomeLower = servicoStr.toLowerCase();
      
      if (nomeLower.includes('combo') || nomeLower.includes('corte + barba')) return 60.00;
      if (nomeLower.includes('corte')) return 35.00;
      if (nomeLower.includes('barba')) return 30.00;
      if (nomeLower.includes('sobrancelha')) return 15.00;

      return 0.00;
    }

    function mostrarToast(mensagem, tipo = 'sucesso') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const corFundo = tipo === 'sucesso' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-300' : 'bg-red-950/90 border-red-500/50 text-red-300';
      
      toast.className = `pointer-events-auto px-4 py-3 rounded-lg border shadow-xl text-xs font-medium backdrop-blur-md transition-all duration-300 translate-y-2 opacity-0 flex items-center gap-2 ${corFundo}`;
      toast.innerHTML = `<span>${mensagem}</span>`;
      container.appendChild(toast);

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function renderStatusBadge(status) {
      if (status === 'Concluído' || status === 'atendido') {
        return `<span class="bg-green-500/10 text-green-400 border border-green-500/30 px-2 py-0.5 rounded-full text-[10px] font-semibold whitespace-nowrap">✓ Concluído</span>`;
      }
      if (status === 'Cancelado' || status === 'cancelado') {
        return `<span class="bg-red-500/10 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full text-[10px] font-semibold whitespace-nowrap">✕ Cancelado</span>`;
      }
      return `<span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 px-2 py-0.5 rounded-full text-[10px] font-semibold whitespace-nowrap">⏱ Agendado</span>`;
    }

    async function carregarAgendamentos() {
      const dataFiltro = document.getElementById('filtroData').value;
      const tbody = document.getElementById('tabelaAgendamentos');
      tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-gray-500">Carregando...</td></tr>';

      try {
        const res = await fetch(`/api/agendamentos?data=${dataFiltro}`);
        const data = await res.json();

        let lista = [];
        if (Array.isArray(data)) lista = data;
        else if (Array.isArray(data.agendamentos)) lista = data.agendamentos;

        if (!lista || lista.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="p-6 text-center text-gray-400">Nenhum agendamento encontrado para esta data.</td></tr>';
          return;
        }

        tbody.innerHTML = lista.map(a => {
          const id = a.id;
          const cliente = a.clienteNome || a.cliente || a.nome || 'Cliente';
          const whats = a.clienteWhatsapp || a.whatsapp || '';
          const servico = a.servicoNome || a.servico || 'Serviço';
          const barbeiro = a.barbeiroNome || a.barbeiro || 'Barbeiro';
          const horario = a.horario || a.hora || '--:--';
          const status = a.status || 'Agendado';
          const dataItem = a.data || dataFiltro;
          
          // Força o cálculo do preço ignorando o campo do banco antigo
          const valorNum = extrairOuMapearPreco(servico);
          const valorFormatado = `R$ ${valorNum.toFixed(2).replace('.', ',')}`;

          const numeroLimpo = whats.replace(/\D/g, '');
          const whatsappUrl = `https://wa.me/55${numeroLimpo.replace(/^55/, '')}`;
          const dataFormatada = dataItem.includes('-') ? dataItem.split('-').reverse().join('/') : dataItem;

          // Unicode seguro para emojis no WhatsApp sem dar erro de encoding (diamantes pretos)
          const textoLembrete = 
            `\u{1F488} *BARBEARIA ESTILO*\n` +
            `----------------------------------------\n` +
            `\u{1F44B} Ol\u00E1, *${cliente}*!\n\n` +
            `Passando para lembrar do seu agendamento:\n\n` +
            `\u{1F4C5} *Data:* ${dataFormatada}\n` +
            `\u{23F0} *Hor\u00E1rio:* ${horario}\n` +
            `\u{2702}\u{FE0F} *Servi\u00E7o:* ${servico}\n` +
            `\u{1F468}\u{200D}\u{1F488} *Barbeiro:* ${barbeiro}\n\n` +
            `Te esperamos aqui! \u{1F680}\n` +
            `----------------------------------------`;

          const msgLembrete = encodeURIComponent(textoLembrete);

          return `
            <tr class="hover:bg-gray-800/50 transition">
              <td class="p-2 sm:p-3 font-bold text-gold whitespace-nowrap">${horario}</td>
              <td class="p-2 sm:p-3 whitespace-nowrap text-xs">${dataFormatada}</td>
              <td class="p-2 sm:p-3 font-semibold text-white whitespace-nowrap text-xs">${cliente}</td>
              <td class="p-2 sm:p-3 whitespace-nowrap text-xs">
                ${numeroLimpo ? `<a href="${whatsappUrl}" target="_blank" class="text-green-400 hover:text-green-300 hover:underline inline-flex items-center gap-1">📱 ${whats}</a>` : '-'}
              </td>
              <td class="p-2 sm:p-3 whitespace-nowrap text-xs">${servico}</td>
              <td class="p-2 sm:p-3 font-bold text-emerald-400 whitespace-nowrap text-xs">${valorFormatado}</td>
              <td class="p-2 sm:p-3 whitespace-nowrap text-xs">${barbeiro}</td>
              <td class="p-2 sm:p-3 text-center whitespace-nowrap">${renderStatusBadge(status)}</td>
              <td class="p-2 sm:p-3 text-center whitespace-nowrap">
                <div class="flex items-center justify-center gap-1.5">
                  ${numeroLimpo ? `
                    <a href="https://wa.me/55${numeroLimpo.replace(/^55/, '')}?text=${msgLembrete}" target="_blank" class="bg-teal-950/60 hover:bg-teal-900/80 text-teal-300 border border-teal-700/50 font-medium px-2 py-1 rounded transition text-[11px]">
                      🗓️ Lembrete
                    </a>
                  ` : ''}
                  ${status !== 'Concluído' && status !== 'atendido' ? `
                    <button onclick="alterarStatus('${id}', 'Concluído')" class="bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-700/50 font-medium px-2 py-1 rounded transition text-[11px] cursor-pointer">
                      Concluir
                    </button>
                  ` : ''}
                  ${status !== 'Cancelado' && status !== 'cancelado' ? `
                    <button onclick="alterarStatus('${id}', 'Cancelado')" class="bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-700/50 font-medium px-2 py-1 rounded transition text-[11px] cursor-pointer">
                      Cancelar
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-red-400">Erro ao carregar dados. Verifique a conexão.</td></tr>';
      }
    }

    async function alterarStatus(id, novoStatus) {
      if (!id) return;
      try {
        const res = await fetch(`/api/agendamentos/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: novoStatus })
        });
        const result = await res.json();

        if (res.ok || result.success) {
          mostrarToast(novoStatus === 'Concluído' ? 'Atendimento concluído!' : 'Agendamento cancelado.', 'sucesso');
          carregarAgendamentos();
        } else {
          mostrarToast(result.message || 'Erro ao atualizar status.', 'erro');
        }
      } catch (err) {
        mostrarToast('Erro ao comunicar com o servidor.', 'erro');
      }
    }

    async function limparAgenda() {
      const dataFiltro = document.getElementById('filtroData').value;
      if (confirm(`Deseja limpar os agendamentos da data ${dataFiltro.split('-').reverse().join('/')}?`)) {
        try {
          const res = await fetch(`/api/agendamentos/limpar?data=${dataFiltro}`, { method: 'DELETE' });
          if (res.ok) {
            mostrarToast('Agenda limpa com sucesso!', 'sucesso');
            carregarAgendamentos();
          }
        } catch (err) {
          mostrarToast('Erro ao limpar a agenda.', 'erro');
        }
      }
    }

    // Inicializa
    carregarAgendamentos();
  </script>
</body>
</html>
